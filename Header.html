<!DOCTYPE html>
<html>
<head>
    <style>
        .header-container {
            width: 100%;
            font-family: Arial, sans-serif;
            font-size: 11px;
            border-bottom: 1px solid #ccc;
            padding: 0 10px 5px 10px;
        }
        .logo-user {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            width: 60px;
            height: auto;
        }
        .user-details {
            flex-grow: 1;
            margin-left: 10px;
            font-size: 10px;
        }
        .report-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="logo-user">
            <img src="sample_logo.png" class="logo" />
            <div class="user-details">
                <div><strong>Kasturi Reports Inc.</strong></div>
                <div>1234 Sample Lane, Report City</div>
                <div>Tel: +91-9999999999 | Email: contact@example.com</div>
            </div>
            <div style="text-align: right; font-size: 10px;">
                Page: [page] of [topage]<br />
                Generated: {{ generation_date }}
            </div>
        </div>
        <div class="report-info">
            <div><strong>Report Name:</strong> Transaction Report</div>
            <div><strong>Date Range:</strong> {{ date_range }}</div>
        </div>
    </div>
</body>
</html>
